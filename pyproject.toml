[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-pocket"
version = "0.1.0"
description = "A small, privacy-conscious Canvas LMS CLI"
requires-python = ">=3.10"
dependencies = ["keyring>=25,<26", "httpx>=0.27,<1"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["ruff>=0.16,<1", "coverage>=7,<8"]

[project.scripts]
canvas-pocket = "canvas_pocket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "DTZ011", "BLE001", "RUF012", "PLC0206", "PLW1510", "SIM114", "SIM117"]
