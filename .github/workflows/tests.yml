name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: |
          python -m venv /tmp/canvas-cli-wheel-check
          /tmp/canvas-cli-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/canvas-cli-wheel-check/bin/canvas-cli capabilities --format brief
          /tmp/canvas-cli-wheel-check/bin/canvas-cli help --format brief
          /tmp/canvas-cli-wheel-check/bin/python -m unittest discover -s tests -v
